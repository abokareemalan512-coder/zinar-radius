<!-- نافذة ربط راوتر / سيرفر جديد -->
<div id="addRouterModal" class="modal">
  <div class="modal-content" style="max-width: 500px; text-align: right; direction: rtl;">
    <h3>ربط راوتر أو سيرفر جديد</h3>
    <form id="addRouterForm" onsubmit="saveRouter(event)">
      
      <div class="form-group mb-3">
        <label>اسم الراوتر / السيرفر</label>
        <input type="text" id="router_name" class="form-control" placeholder="مثال: ZINAR.net" required>
      </div>

      <div class="form-group mb-3">
        <label>عنوان الراوتر العام أو النطاق</label>
        <input type="text" id="router_ip" class="form-control" placeholder="عنوان الراوتر، وليس 188.145.118.146" required>
      </div>

      <div class="row mb-3" style="display: flex; gap: 10px;">
        <div style="flex: 2;">
          <label>اسم المستخدم</label>
          <input type="text" id="router_username" class="form-control" placeholder="admin" value="admin" required>
        </div>
        <div style="flex: 1;">
          <label>المنفذ (Port)</label>
          <input type="number" id="router_port" class="form-control" placeholder="8728" value="8728" required>
        </div>
      </div>

      <div class="form-group mb-3">
        <label>كلمة المرور</label>
        <input type="password" id="router_password" class="form-control" placeholder="كلمة مرور المايكروتك">
      </div>

      <div class="form-check mb-3" style="display: flex; align-items: center; gap: 8px;">
        <input type="checkbox" id="router_ssl" class="form-check-input">
        <label for="router_ssl" class="form-check-label">API-SSL</label>
      </div>

      <div style="display: flex; gap: 10px; margin-top: 20px;">
        <button type="submit" class="btn btn-success" style="flex: 1; background-color: #a3e635; color: #000; border: none; font-weight: bold; padding: 10px;">امتحن الاتصال والحفظ</button>
        <button type="button" onclick="closeRouterModal()" class="btn btn-secondary">إلغاء</button>
      </div>

    </form>
  </div>
</div>
