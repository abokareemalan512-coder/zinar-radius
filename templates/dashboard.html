<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم - زنار RADIUS</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-[#0f1117] text-gray-100 font-sans antialiased min-h-screen p-6">

    <!-- الهيدر العلوي: زر اللغة والملف + عنوان لوحة التحكم -->
    <div class="flex justify-between items-center mb-8">
        <!-- أزرار اللغة والبروفايل -->
        <div class="flex items-center gap-3">
            <button class="w-8 h-8 rounded-full bg-gray-800/80 text-gray-400 hover:text-white flex items-center justify-center transition-colors">
                <i data-lucide="user" class="w-4 h-4"></i>
            </button>
            <div class="bg-gray-800/80 p-1 rounded-lg flex items-center border border-gray-700/50">
                <button class="px-3 py-1 text-xs text-gray-400 rounded hover:text-white transition-colors">EN</button>
                <button class="px-3 py-1 text-xs bg-gray-600 text-white rounded font-medium shadow-sm">عربي</button>
            </div>
        </div>

        <!-- عنوان الصفحة والشعار الفرعي -->
        <div class="text-right">
            <h1 class="text-2xl font-bold text-white tracking-wide">لوحة التحكم</h1>
            <span class="text-xs text-gray-500 font-mono block mt-0.5">zinar.net.com</span>
        </div>
    </div>

    <!-- شبكة البطاقات الإحصائية (Cards Grid) - 4 أعمدة في الصف -->
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-5">

        <!-- 1. إجمالي المستخدمين -->
        <div class="bg-[#161922] border border-gray-800/80 rounded-2xl p-6 flex flex-col items-center justify-center shadow-lg hover:border-gray-700 transition-all">
            <div class="w-14 h-14 rounded-xl bg-blue-500/10 border border-blue-500/20 text-blue-400 flex items-center justify-center mb-4">
                <i data-lucide="users" class="w-7 h-7"></i>
            </div>
            <span class="text-3xl font-extrabold text-white mb-2">0</span>
            <span class="text-xs text-gray-400 font-medium">إجمالي المستخدمين</span>
        </div>

        <!-- 2. الجلسات النشطة active_sessions -->
        <div class="bg-[#161922] border border-gray-800/80 rounded-2xl p-6 flex flex-col items-center justify-center shadow-lg hover:border-gray-700 transition-all">
            <div class="w-14 h-14 rounded-xl bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 flex items-center justify-center mb-4">
                <i data-lucide="wifi" class="w-7 h-7"></i>
            </div>
            <span class="text-3xl font-extrabold text-emerald-400 mb-2">0</span>
            <span class="text-xs text-gray-400 font-medium">active_sessions</span>
        </div>

        <!-- 3. الباقات -->
        <div class="bg-[#161922] border border-gray-800/80 rounded-2xl p-6 flex flex-col items-center justify-center shadow-lg hover:border-gray-700 transition-all">
            <div class="w-14 h-14 rounded-xl bg-amber-500/10 border border-amber-500/20 text-amber-400 flex items-center justify-center mb-4">
                <i data-lucide="package" class="w-7 h-7"></i>
            </div>
            <span class="text-3xl font-extrabold text-amber-400 mb-2">6</span>
            <span class="text-xs text-gray-400 font-medium">الباقات</span>
        </div>

        <!-- 4. الراوترات -->
        <div class="bg-[#161922] border border-gray-800/80 rounded-2xl p-6 flex flex-col items-center justify-center shadow-lg hover:border-gray-700 transition-all cursor-pointer" onclick="openRouterModal()">
            <div class="w-14 h-14 rounded-xl bg-indigo-500/10 border border-indigo-500/20 text-indigo-400 flex items-center justify-center mb-4">
                <i data-lucide="router" class="w-7 h-7"></i>
            </div>
            <span class="text-3xl font-extrabold text-indigo-400 mb-2">0</span>
            <span class="text-xs text-gray-400 font-medium">الراوترات</span>
        </div>

        <!-- 5. today_revenue -->
        <div class="bg-[#161922] border border-gray-800/80 rounded-2xl p-6 flex flex-col items-center justify-center shadow-lg hover:border-gray-700 transition-all">
            <div class="w-14 h-14 rounded-xl bg-rose-500/10 border border-rose-500/20 text-rose-400 flex items-center justify-center mb-4">
                <i data-lucide="banknote" class="w-7 h-7"></i>
            </div>
            <span class="text-3xl font-extrabold text-rose-400 mb-2">0</span>
            <span class="text-xs text-gray-400 font-medium">today_revenue</span>
        </div>

        <!-- 6. customers -->
        <div class="bg-[#161922] border border-gray-800/80 rounded-2xl p-6 flex flex-col items-center justify-center shadow-lg hover:border-gray-700 transition-all">
            <div class="w-14 h-14 rounded-xl bg-purple-500/10 border border-purple-500/20 text-purple-400 flex items-center justify-center mb-4">
                <i data-lucide="building-2" class="w-7 h-7"></i>
            </div>
            <span class="text-3xl font-extrabold text-purple-400 mb-2">1</span>
            <span class="text-xs text-gray-400 font-medium">customers</span>
        </div>

        <!-- 7. active_vouchers -->
        <div class="bg-[#161922] border border-gray-800/80 rounded-2xl p-6 flex flex-col items-center justify-center shadow-lg hover:border-gray-700 transition-all">
            <div class="w-14 h-14 rounded-xl bg-teal-500/10 border border-teal-500/20 text-teal-400 flex items-center justify-center mb-4">
                <i data-lucide="ticket" class="w-7 h-7"></i>
            </div>
            <span class="text-3xl font-extrabold text-teal-400 mb-2">0</span>
            <span class="text-xs text-gray-400 font-medium">active_vouchers</span>
        </div>

        <!-- 8. new_users_today -->
        <div class="bg-[#161922] border border-gray-800/80 rounded-2xl p-6 flex flex-col items-center justify-center shadow-lg hover:border-gray-700 transition-all">
            <div class="w-14 h-14 rounded-xl bg-orange-500/10 border border-orange-500/20 text-orange-400 flex items-center justify-center mb-4">
                <i data-lucide="user-plus" class="w-7 h-7"></i>
            </div>
            <span class="text-3xl font-extrabold text-orange-400 mb-2">0</span>
            <span class="text-xs text-gray-400 font-medium">new_users_today</span>
        </div>

    </div>

    <!-- النافذة المنبثقة لإضافة راوتر Modal -->
    <div id="addRouterModal" class="fixed inset-0 bg-black/80 hidden items-center justify-center z-50 p-4">
        <div class="bg-[#161922] border border-gray-800 rounded-2xl w-full max-w-md p-6 text-white shadow-2xl">
            <h3 class="text-lg font-bold mb-4 text-center">ربط راوتر أو سيرفر جديد</h3>
            
            <form id="addRouterForm" onsubmit="saveRouter(event)" class="space-y-4">
                <div>
                    <label class="block text-xs text-gray-400 mb-1">اسم الراوتر / السيرفر</label>
                    <input type="text" id="router_name" class="w-full bg-[#0f1117] border border-gray-800 rounded-xl p-2.5 text-sm text-white focus:outline-none focus:border-blue-500" placeholder="مثال: ZINAR.net" required>
                </div>

                <div>
                    <label class="block text-xs text-gray-400 mb-1">عنوان الراوتر العام أو النطاق</label>
                    <input type="text" id="router_ip" class="w-full bg-[#0f1117] border border-gray-800 rounded-xl p-2.5 text-sm text-white focus:outline-none focus:border-blue-500" placeholder="عنوان الراوتر، وليس IP محلي" required>
                </div>

                <div class="flex gap-3">
                    <div class="flex-1">
                        <label class="block text-xs text-gray-400 mb-1">اسم المستخدم</label>
                        <input type="text" id="router_username" class="w-full bg-[#0f1117] border border-gray-800 rounded-xl p-2.5 text-sm text-white focus:outline-none focus:border-blue-500" value="admin" required>
                    </div>
                    <div class="w-28">
                        <label class="block text-xs text-gray-400 mb-1">المنفذ (Port)</label>
                        <input type="number" id="router_port" class="w-full bg-[#0f1117] border border-gray-800 rounded-xl p-2.5 text-sm text-white focus:outline-none focus:border-blue-500" value="8728" required>
                    </div>
                </div>

                <div>
                    <label class="block text-xs text-gray-400 mb-1">كلمة المرور</label>
                    <input type="password" id="router_password" class="w-full bg-[#0f1117] border border-gray-800 rounded-xl p-2.5 text-sm text-white focus:outline-none focus:border-blue-500" placeholder="•••••">
                </div>

                <div class="flex items-center gap-2">
                    <input type="checkbox" id="router_ssl" class="rounded bg-gray-800 border-gray-700 text-blue-600">
                    <label for="router_ssl" class="text-sm cursor-pointer text-gray-300">API-SSL</label>
                </div>

                <div class="flex gap-3 pt-2">
                    <button type="submit" class="flex-1 bg-lime-500 hover:bg-lime-400 text-black font-bold py-2.5 px-4 rounded-xl text-sm transition-colors">
                        امتحن الاتصال والحفظ
                    </button>
                    <button type="button" onclick="closeRouterModal()" class="bg-gray-800 hover:bg-gray-700 text-white font-medium py-2.5 px-4 rounded-xl text-sm transition-colors">
                        إلغاء
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Script للتحكم في الأيقونات والنافذة المنبثقة -->
    <script>
        // إظهار أيقونات Lucide
        lucide.createIcons();

        function openRouterModal() {
            document.getElementById('addRouterModal').classList.remove('hidden');
            document.getElementById('addRouterModal').classList.add('flex');
        }

        function closeRouterModal() {
            document.getElementById('addRouterModal').classList.add('hidden');
            document.getElementById('addRouterModal').classList.remove('flex');
        }

        function saveRouter(event) {
            if (event) event.preventDefault();

            const name = document.getElementById('router_name').value;
            const ip = document.getElementById('router_ip').value;
            const username = document.getElementById('router_username').value;
            const port = document.getElementById('router_port').value;
            const password = document.getElementById('router_password').value;
            const use_ssl = document.getElementById('router_ssl').checked;

            const data = {
                name: name,
                ip_address: ip,
                username: username,
                port: port,
                password: password,
                use_ssl: use_ssl
            };

            fetch('/api/routers', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(data)
            })
            .then(res => res.json())
            .then(res => {
                alert(res.message || 'تم حفظ السيرفر بنجاح');
                closeRouterModal();
                window.location.reload();
            })
            .catch(err => {
                console.error('Error:', err);
                alert('حدث خطأ أثناء الاتصال بالسيرفر');
            });
        }
    </script>
</body>
</html>
