<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم - منصة زنار RADIUS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --bg-dark: #0f172a; --card-bg: #1e293b; --accent: #6366f1; --border-color: #334155; }
        body { background-color: var(--bg-dark); color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
        .sidebar { background-color: var(--card-bg); border-left: 1px solid var(--border-color); min-height: 100vh; }
        .nav-link { color: #94a3b8; border-radius: 8px; margin-bottom: 4px; padding: 10px 15px; }
        .nav-link:hover, .nav-link.active { background-color: var(--accent); color: #ffffff; }
        .stat-card { background-color: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 1.5rem; transition: transform 0.2s; }
        .stat-card:hover { transform: translateY(-3px); }
        .stat-icon { font-size: 2rem; color: var(--accent); }
        .top-navbar { background-color: var(--card-bg); border-bottom: 1px solid var(--border-color); }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <!-- الشريط الجانبي -->
            <nav class="col-md-3 col-lg-2 sidebar p-3 d-none d-md-block">
                <div class="d-flex align-items-center mb-4 px-2">
                    <i class="fa-solid fa-shield-halved text-primary fs-3 me-2"></i>
                    <h4 class="m-0 fw-bold text-white">زنار RADIUS</h4>
                </div>
                <ul class="nav flex-column">
                    <li class="nav-item"><a class="nav-link active" href="/dashboard"><i class="fa-solid fa-chart-line me-2"></i> لوحة التحكم</a></li>
                    <li class="nav-item"><a class="nav-link" href="#"><i class="fa-solid fa-users me-2"></i> المشتركين</a></li>
                    <li class="nav-item"><a class="nav-link" href="#"><i class="fa-solid fa-ticket me-2"></i> الكروت والباقات</a></li>
                    <li class="nav-item"><a class="nav-link" href="#"><i class="fa-solid fa-network-wired me-2"></i> الراوترات</a></li>
                    <li class="nav-item"><a class="nav-link" href="#"><i class="fa-solid fa-gear me-2"></i> الإعدادات</a></li>
                    <li class="nav-item mt-4"><a class="nav-link text-danger" href="/logout"><i class="fa-solid fa-right-from-bracket me-2"></i> تسجيل الخروج</a></li>
                </ul>
            </nav>

            <!-- المحتوى الرئيسي -->
            <main class="col-md-9 col-lg-10 ms-sm-auto px-md-4 py-4">
                <div class="top-navbar p-3 mb-4 rounded d-flex justify-content-between align-items-center">
                    <h5 class="m-0 text-white">نظرة عامة على النظام</h5>
                    <span class="badge bg-success px-3 py-2"><i class="fa-solid fa-circle me-1 fs-6"></i> السيرفر متصل (Live)</span>
                </div>

                <!-- بطاقات الإحصائيات -->
                <div class="row g-4 mb-4">
                    <div class="col-md-4">
                        <div class="stat-card d-flex justify-content-between align-items-center">
                            <div>
                                <h6 class="text-muted mb-2">المستخدمين النشطين</h6>
                                <h3 class="fw-bold m-0 text-white">124</h3>
                            </div>
                            <div class="stat-icon"><i class="fa-solid fa-user-check"></i></div>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="stat-card d-flex justify-content-between align-items-center">
                            <div>
                                <h6 class="text-muted mb-2">إجمالي الكروت</h6>
                                <h3 class="fw-bold m-0 text-white">1,450</h3>
                            </div>
                            <div class="stat-icon"><i class="fa-solid fa-ticket"></i></div>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="stat-card d-flex justify-content-between align-items-center">
                            <div>
                                <h6 class="text-muted mb-2">الجلسات النشطة</h6>
                                <h3 class="fw-bold m-0 text-white">89</h3>
                            </div>
                            <div class="stat-icon"><i class="fa-solid fa-wifi"></i></div>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>
</body>
</html>
