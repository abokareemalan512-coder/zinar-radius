<!-- تنسيقات النافذة المنبثقة Modal CSS -->
<style>
  .custom-modal-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(0, 0, 0, 0.75);
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 9999;
  }
  .custom-modal-box {
    background-color: #111827;
    border: 1px solid #1f2937;
    border-radius: 12px;
    width: 90%;
    max-width: 480px;
    padding: 24px;
    color: #ffffff;
    direction: rtl;
    box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    font-family: system-ui, -apple-system, sans-serif;
  }
  .custom-modal-box h3 {
    margin-top: 0;
    margin-bottom: 20px;
    font-size: 20px;
    color: #ffffff;
    text-align: right;
  }
  .form-group-custom {
    margin-bottom: 16px;
    text-align: right;
  }
  .form-group-custom label {
    display: block;
    margin-bottom: 6px;
    font-size: 14px;
    color: #9ca3af;
  }
  .form-input-custom {
    width: 100%;
    padding: 10px 12px;
    background-color: #1f2937;
    border: 1px solid #374151;
    border-radius: 6px;
    color: #ffffff;
    font-size: 14px;
    box-sizing: border-box;
    outline: none;
  }
  .form-input-custom:focus {
    border-color: #3b82f6;
  }
  .form-row-custom {
    display: flex;
    gap: 12px;
  }
  .btn-submit-custom {
    width: 100%;
    background-color: #a3e635;
    color: #000000;
    font-weight: bold;
    padding: 12px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-size: 15px;
    transition: background 0.2s;
  }
  .btn-submit-custom:hover {
    background-color: #84cc16;
  }
  .btn-cancel-custom {
    background-color: #374151;
    color: #ffffff;
    padding: 12px 20px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-size: 15px;
  }
</style>

<!-- نافذة ربط الراوتر / السيرفر المنسقة -->
<div id="addRouterModal" class="custom-modal-overlay">
  <div class="custom-modal-box">
    <h3>ربط راوتر أو سيرفر جديد</h3>
    
    <form id="addRouterForm" onsubmit="saveRouter(event)">
      
      <div class="form-group-custom">
        <label>اسم الراوتر / السيرفر</label>
        <input type="text" id="router_name" class="form-input-custom" placeholder="مثال: ZINAR.net" required>
      </div>

      <div class="form-group-custom">
        <label>عنوان الراوتر العام أو النطاق</label>
        <input type="text" id="router_ip" class="form-input-custom" placeholder="عنوان الراوتر، وليس 188.145.118.146" required>
      </div>

      <div class="form-row-custom">
        <div class="form-group-custom" style="flex: 2;">
          <label>اسم المستخدم</label>
          <input type="text" id="router_username" class="form-input-custom" value="admin" required>
        </div>
        <div class="form-group-custom" style="flex: 1;">
          <label>المنفذ (Port)</label>
          <input type="number" id="router_port" class="form-input-custom" value="8728" required>
        </div>
      </div>

      <div class="form-group-custom">
        <label>كلمة المرور</label>
        <input type="password" id="router_password" class="form-input-custom" placeholder="كلمة مرور المايكروتك">
      </div>

      <div class="form-group-custom" style="display: flex; align-items: center; gap: 8px; margin-top: 10px;">
        <input type="checkbox" id="router_ssl" style="width: 18px; height: 18px; cursor: pointer;">
        <label for="router_ssl" style="margin: 0; cursor: pointer; color: #ffffff;">API-SSL</label>
      </div>

      <div style="display: flex; gap: 10px; margin-top: 24px;">
        <button type="submit" class="btn-submit-custom">امتحن الاتصال والحفظ</button>
        <button type="button" onclick="closeRouterModal()" class="btn-cancel-custom">إلغاء</button>
      </div>

    </form>
  </div>
</div>
