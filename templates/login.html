<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - منصة زنار RADIUS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
        .login-card { background-color: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 2rem; width: 100%; max-width: 400px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .btn-primary { background-color: #6366f1; border: none; padding: 0.75rem; border-radius: 8px; font-weight: 600; }
        .btn-primary:hover { background-color: #4f46e5; }
        .form-control { background-color: #0f172a; border: 1px solid #334155; color: #fff; padding: 0.75rem; }
        .form-control:focus { background-color: #0f172a; color: #fff; border-color: #6366f1; box-shadow: none; }
    </style>
</head>
<body>
    <div class="login-card">
        <h3 class="text-center mb-4 font-weight-bold">منصة زنار RADIUS</h3>
        <form action="/login" method="POST">
            <div class="mb-3">
                <label class="form-label">اسم المستخدم</label>
                <input type="text" name="username" class="form-control" required placeholder="أدخل اسم المستخدم">
            </div>
            <div class="mb-3">
                <label class="form-label">كلمة المرور</label>
                <input type="password" name="password" class="form-control" required placeholder="أدخل كلمة المرور">
            </div>
            <button type="submit" class="btn btn-primary w-100 mt-3">تسجيل الدخول</button>
        </form>
    </div>
</body>
</html>
