# ═══════════════════════════════════════════
#  Nginx Reverse Proxy Config for zinar.net.com
#  🔐 زنار — RADIUS User Management
# ═══════════════════════════════════════════
#
#  Install:  sudo cp nginx-zinar.conf /etc/nginx/sites-available/
#  Enable:   sudo ln -s /etc/nginx/sites-available/nginx-zinar.conf /etc/nginx/sites-enabled/
#  Test:     sudo nginx -t
#  Reload:   sudo systemctl reload nginx
#
#  Prerequisites:
#  - Domain zinar.net.com pointing to this server's IP (A record)
#  - SSL certificate (use certbot for Let's Encrypt):
#    sudo apt install certbot python3-certbot-nginx
#    sudo certbot --nginx -d zinar.net.com
# ═══════════════════════════════════════════

server {
    listen 80;
    server_name zinar.net.com;

    location / {
        proxy_pass http://127.0.0.1:1892;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300;
        proxy_connect_timeout 300;
    }
}

