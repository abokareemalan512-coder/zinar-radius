<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>منصة زنار RADIUS - لوحة التحكم</title>
    <link rel="stylesheet" href="[https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css](https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css)">
    <link rel="stylesheet" href="[https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css](https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css)">
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: system-ui; }
        .sidebar { width: 250px; background: #1e293b; min-height: 100vh; position: fixed; }
        .main-content { margin-right: 250px; padding: 20px; }
        .nav-link { color: #94a3b8; padding: 12px 20px; display: flex; align-items: center; gap: 10px; }
        .nav-link:hover, .nav-link.active { background: #334155; color: #fff; border-radius: 8px; }
        .card-custom { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 20px; }
    </style>
</head>
<body>

<div class="sidebar p-3">
    <h4 class="text-white fw-bold mb-4"><i class="bi bi-shield-lock-fill text-primary"></i> منصة زنار</h4>
    <nav class="nav flex-column gap-1">
        <a href="#" class="nav-link active"><i class="bi bi-speedometer2"></i> لوحة التحكم</a>
        <a href="#" class="nav-link"><i class="bi bi-people-fill"></i> المشتركين</a>
        <a href="#" class="nav-link"><i class="bi bi-router-fill"></i> الراوترات</a>
        <a href="#" class="nav-link" data-bs-toggle="modal" data-bs-target="#profileModal"><i class="bi bi-person-gear text-warning"></i> إعدادات الحساب</a>
        <a href="{{ url_for('logout') }}" class="nav-link text-danger"><i class="bi bi-box-arrow-right"></i> خروج</a>
    </nav>
</div>

<div class="main-content">
    <div class="d-flex justify-content-between align-items-center mb-4 pb-3 border-bottom border-secondary">
        <h2>لوحة التحكم</h2>
        <div class="dropdown">
            <button class="btn btn-dark dropdown-toggle d-flex align-items-center gap-2" type="button" data-bs-toggle="dropdown">
                <i class="bi bi-person-circle fs-4 text-primary"></i>
                <span>{{ session.get('admin_username', 'admin') }}</span>
            </button>
            <ul class="dropdown-menu dropdown-menu-dark dropdown-menu-end shadow">
                <li><a class="dropdown-item" href="#" data-bs-toggle="modal" data-bs-target="#profileModal"><i class="bi bi-gear me-2"></i> تغيير اسم المستخدم وكلمة المرور</a></li>
                <li><hr class="dropdown-divider"></li>
                <li><a class="dropdown-item text-danger" href="{{ url_for('logout') }}"><i class="bi bi-box-arrow-right me-2"></i> خروج</a></li>
            </ul>
        </div>
    </div>

    <div class="row g-4">
        <div class="col-md-6">
            <div class="card-custom d-flex align-items-center gap-3">
                <i class="bi bi-people fs-1 text-primary"></i>
                <div>
                    <h6 class="text-muted mb-0">إجمالي المشتركين</h6>
                    <h3 class="fw-bold mb-0">{{ total_users }}</h3>
                </div>
            </div>
        </div>
        <div class="col-md-6">
            <div class="card-custom d-flex align-items-center gap-3">
                <i class="bi bi-router fs-1 text-success"></i>
                <div>
                    <h6 class="text-muted mb-0">الراوترات الموصولة</h6>
                    <h3 class="fw-bold mb-0">{{ total_nas }}</h3>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Modal التغيير الحقيقي للبيانات -->
<div class="modal fade" id="profileModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content bg-dark text-white border-secondary">
            <div class="modal-header border-secondary">
                <h5 class="modal-title"><i class="bi bi-person-lock text-primary me-2"></i>تعديل بيانات الحساب</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div id="alertMsg" class="alert d-none"></div>
                <div class="mb-3">
                    <label class="form-label">اسم المستخدم الجديد</label>
                    <input type="text" id="newUsername" class="form-control bg-secondary text-white border-0" value="{{ session.get('admin_username', 'admin') }}">
                </div>
                <div class="mb-3">
                    <label class="form-label">كلمة المرور الجديدة</label>
                    <input type="password" id="newPassword" class="form-control bg-secondary text-white border-0" placeholder="أدخل كلمة المرور الجديدة">
                </div>
            </div>
            <div class="modal-footer border-secondary">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">إلغاء</button>
                <button type="button" class="btn btn-primary" onclick="saveProfile()">حفظ التغييرات</button>
            </div>
        </div>
    </div>
</div>

<script src="[https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js](https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js)"></script>
<script>
function saveProfile() {
    const username = document.getElementById('newUsername').value;
    const password = document.getElementById('newPassword').value;
    const alertMsg = document.getElementById('alertMsg');

    fetch('/admin/update-profile', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: username, password: password })
    })
    .then(res => res.json())
    .then(data => {
        alertMsg.classList.remove('d-none', 'alert-danger', 'alert-success');
        if(data.success) {
            alertMsg.classList.add('alert-success');
            alertMsg.innerText = data.message;
            setTimeout(() => location.reload(), 1000);
        } else {
            alertMsg.classList.add('alert-danger');
            alertMsg.innerText = data.message;
        }
    });
}
</script>
</body>
</html>
